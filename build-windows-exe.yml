name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sungyoon-codex

permissions:
  contents: write

concurrency:
  group: windows-exe-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest
      - name: Build standalone executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DrawingRequestRevisionTool
          --hidden-import fitz
          --exclude-module pytest
          --exclude-module pygments
          --paths .
          desktop/app.py
      - name: Smoke-test executable
        run: .\dist\DrawingRequestRevisionTool.exe --smoke-test
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawingRequestRevisionTool-Windows
          path: dist/DrawingRequestRevisionTool.exe
          if-no-files-found: error
      - name: Choose next release version
        id: version
        shell: pwsh
        run: |
          git fetch --force --tags
          $latest = git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname |
            Select-Object -First 1
          if (-not $latest) {
            $next = "v1.0.0"
          } elseif ($latest -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $next = "v$($matches[1]).$($matches[2]).$([int]$matches[3] + 1)"
          } else {
            throw "Unsupported release tag: $latest"
          }
          "tag=$next" >> $env:GITHUB_OUTPUT
          "Next release: $next"
      - name: Publish Windows EXE release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag `
            "dist/DrawingRequestRevisionTool.exe" `
            --target "${{ github.sha }}" `
            --title "Drawing Request Revision Tool $tag" `
            --notes "Automatically built from commit ${{ github.sha }} after Team Sync upload." `
            --latest
